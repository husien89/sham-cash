<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShamCash | المحفظة</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script defer src="/static/auth.js"></script>
  <script defer src="/static/app.js"></script>
</head>
<body>
  <header class="topbar"><h1>ShamCash</h1><button id="logout-button" class="secondary">تسجيل الخروج</button></header>
  <main class="container">
    <section class="card balance-card">
      <p>الرصيد الحالي</p>
      <h2 id="balance-display">$ 0.00</h2>
    </section>
    <section class="actions"><button class="btn-receive" type="button">استقبال الأموال</button></section>
  </main>
  <div id="qr-modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="qr-title">
    <section class="card modal-card">
      <h2 id="qr-title">استقبل الأموال</h2>
      <canvas id="qr-canvas" aria-label="رمز QR للدفع"></canvas>
      <p id="qr-username"></p>
      <button id="close-qr" class="secondary" type="button">إغلاق</button>
    </section>
  </div>
</body>
</html>
