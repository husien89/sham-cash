<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - ShamCash</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body style="background: var(--primary); display: flex; align-items: center; justify-content: center; height: 100vh;">
    <div style="background: white; padding: 30px; border-radius: 15px; width: 90%; max-width: 400px; text-align: center;">
        <img src="logo.png" alt="ShamCash" style="width: 80px; margin-bottom: 20px;">
        <h2 style="margin-bottom: 20px; color: var(--primary);">تسجيل الدخول</h2>
        <form id="login-form">
            <input type="text" id="username" placeholder="اسم المستخدم" style="width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px;">
            <input type="password" id="password" placeholder="كلمة المرور" style="width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 8px;">
            <button type="submit" style="width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">دخول</button>
        </form>
        <p id="error" style="color: red; margin-top: 10px; display: none;"></p>
    </div>
    <script src="auth.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            if (auth.login(document.getElementById('username').value, document.getElementById('password').value)) {
                window.location.href = 'index.html';
            } else {
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = 'بيانات خاطئة';
            }
        });
    </script>
</body>
</html>
