<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShamCash | تسجيل الدخول</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="auth-page">
  <main class="card auth-card">
    <h1>ShamCash</h1>
    <p>سجّل الدخول إلى محفظتك أو أنشئ حساباً جديداً.</p>
    <form id="auth-form">
      <label for="username">اسم المستخدم</label>
      <input id="username" name="username" autocomplete="username" minlength="3" maxlength="32" required>
      <label for="password">كلمة المرور</label>
      <input id="password" name="password" type="password" autocomplete="current-password" minlength="10" required>
      <div id="register-fields" hidden>
        <label for="name">الاسم</label>
        <input id="name" name="name" autocomplete="name">
        <label for="email">البريد الإلكتروني (اختياري)</label>
        <input id="email" name="email" type="email" autocomplete="email">
      </div>
      <p id="form-error" class="error" role="alert" hidden></p>
      <button id="submit-button" type="submit">دخول</button>
    </form>
    <button id="mode-button" class="link-button" type="button">إنشاء حساب جديد</button>
  </main>
  <script src="/static/auth.js"></script>
  <script>
    const form = document.getElementById('auth-form');
    const errorBox = document.getElementById('form-error');
    const registerFields = document.getElementById('register-fields');
    const submitButton = document.getElementById('submit-button');
    const modeButton = document.getElementById('mode-button');
    let registering = false;

    modeButton.addEventListener('click', () => {
      registering = !registering;
      registerFields.hidden = !registering;
      document.getElementById('name').required = registering;
      document.getElementById('password').autocomplete = registering ? 'new-password' : 'current-password';
      submitButton.textContent = registering ? 'إنشاء الحساب' : 'دخول';
      modeButton.textContent = registering ? 'لديك حساب؟ سجّل الدخول' : 'إنشاء حساب جديد';
      errorBox.hidden = true;
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorBox.hidden = true;
      submitButton.disabled = true;
      const values = new FormData(form);
      try {
        if (registering) {
          await auth.register(values.get('username').trim(), values.get('password'), values.get('name').trim(), values.get('email').trim());
        } else {
          await auth.login(values.get('username').trim(), values.get('password'));
        }
        window.location.assign('/wallet');
      } catch (error) {
        errorBox.textContent = error.message;
        errorBox.hidden = false;
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
