<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sham Cash - الإشعارات</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <img src="logo.png" alt="ShamCash" height="30">
        </div>
        <div class="nav-links">
            <a href="index.html">الرئيسية</a>
            <a href="notifications.html" class="active">الإشعارات</a>
            <a href="settings.html">الإعدادات</a>
            <a href="#" onclick="auth.logout()">خروج</a>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <h2>سجل الإشعارات</h2>
                <div class="card-actions">
                    <input type="text" id="search-notif" placeholder="بحث في الإشعارات...">
                    <button class="btn-secondary" onclick="app.exportPDF()">تصدير PDF</button>
                </div>
            </div>
            
            <div id="notif-list" class="notif-list">
                <!-- سيتم ملؤها بواسطة JavaScript -->
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="data.js"></script>
    <script src="app.js"></script>
    <script>
        auth.requireAuth();
        
        document.getElementById('search-notif').addEventListener('input', () => {
            app.renderNotifications();
        });
        
        // تحميل الإشعارات عند فتح الصفحة
        app.renderNotifications();
    </script>
</body>
</html>
